[project]
name = "toh-app"
version = "0.1.0"
description = "Tower of Hanoi visualizer for Occidental College CS 101"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
toh = "toh_app.__main__:main"
bake = "toh_app.bake:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toh_app"]
